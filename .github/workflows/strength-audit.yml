name: Vanta Strength Audit

on:
  pull_request:
    paths:
      - 'src/engine/**'
      - 'tests/**'
      - '.github/workflows/strength-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce critical Vanta positions
        run: node src/engine/strength-audit.js | tee strength-audit.log
      - name: Upload audit log
        uses: actions/upload-artifact@v4
        with:
          name: vanta-strength-audit
          path: strength-audit.log
