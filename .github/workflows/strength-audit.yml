name: Vanta Strength Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  head-to-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize pre-audit baseline
        run: git worktree add /tmp/vanta-old 0780bef7bd345b624dd69351e509c1f5a02035b9
      - name: Run 24-game equal-time old-vs-new match
        env:
          OLD_ROOT: /tmp/vanta-old
          NEW_ROOT: ${{ github.workspace }}
          MOVE_TIME_MS: '120'
          MAX_PLIES: '100'
        run: node src/engine/head-to-head.js
