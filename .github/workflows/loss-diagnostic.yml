name: Vanta 1266 Loss Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/diagnose-1266-loss.js'
      - '.github/workflows/loss-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression diagnostics
        run: node scripts/diagnose-1266-loss.js
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: vanta-loss-1266-diagnostic
          path: benchmarks/loss-1266-diagnostic.json
          if-no-files-found: error
