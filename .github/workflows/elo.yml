name: Vanta Elo Calibration

on:
  push:
    branches: [main]
    paths:
      - 'src/engine/**'
      - 'src/chess/**'
      - '.github/workflows/elo.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: vanta-elo-calibration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MOVE_TIME_MS: '650'
      MAX_PLIES: '140'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Stockfish reference engine
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          test -x /usr/games/stockfish
      - name: Legacy 1500 Elo anchor
        env:
          VANTA_ENGINE: 'legacy'
          ELO_TARGETS: '1500'
          ELO_REPORT: 'benchmarks/elo-legacy-quick.json'
        run: node src/engine/elo-match.js
      - name: Repaired 1500 Elo anchor
        env:
          VANTA_ENGINE: 'repaired'
          ELO_TARGETS: '1500'
          ELO_REPORT: 'benchmarks/elo-quick.json'
        run: node src/engine/elo-match.js
      - name: Full repaired Stockfish Elo ladder
        env:
          VANTA_ENGINE: 'repaired'
          ELO_TARGETS: '1320,1450,1600,1750'
          ELO_REPORT: 'benchmarks/elo-latest.json'
        run: node src/engine/elo-match.js
      - name: Upload Elo reports
        uses: actions/upload-artifact@v4
        with:
          name: vanta-elo-report
          path: |
            benchmarks/elo-legacy-quick.json
            benchmarks/elo-quick.json
            benchmarks/elo-latest.json
          if-no-files-found: error
      - name: Publish calibration reports
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/elo-legacy-quick.json benchmarks/elo-quick.json benchmarks/elo-latest.json
          git commit -m 'Record Vanta loss-repair calibration' || true
          git push

# The legacy and repaired anchors use the same Stockfish build, openings, colors,
# move time, and ply cap so before/after comparisons are not confounded by setup.
